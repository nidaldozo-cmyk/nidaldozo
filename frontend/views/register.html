<div class="fitpulse-auth-shell">
  <section class="card fitpulse-auth-card" aria-labelledby="register-title">
    <h1 class="fitpulse-auth-title" id="register-title">Register</h1>
    <form class="fitpulse-register-form">
      <div class="fitpulse-auth-field">
        <label for="register-name">Name:</label>
        <input
          type="text"
          class="form-control"
          id="register-name"
          name="name"
          autocomplete="name"
          required
        >
      </div>
      <div class="fitpulse-auth-field">
        <label for="register-email">Email:</label>
        <input
          type="email"
          class="form-control"
          id="register-email"
          name="email"
          autocomplete="email"
          required
        >
      </div>
      <div class="fitpulse-auth-field">
        <label for="register-password">Password:</label>
        <input
          type="password"
          class="form-control"
          id="register-password"
          name="password"
          autocomplete="new-password"
          required
        >
      </div>
      <div class="fitpulse-auth-field">
        <label for="register-confirm-password">Confirm password:</label>
        <input
          type="password"
          class="form-control"
          id="register-confirm-password"
          name="confirm-password"
          autocomplete="new-password"
          required
        >
      </div>
      <button type="submit" class="fitpulse-auth-submit">Register</button>
    </form>
  </section>
</div>
