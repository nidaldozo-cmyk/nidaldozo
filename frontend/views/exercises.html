<section class="container py-4 fitpulse-page-appear fitpulse-exercises-page" aria-labelledby="exercises-title">
  <header class="mb-4">
    <span class="fitpulse-dashboard-eyebrow">FIND YOUR NEXT MOVE</span>
    <h1 class="mb-0 fitpulse-section-title" id="exercises-title">Exercises</h1>
  </header>

  <form class="card fitpulse-dashboard-panel mb-4" id="external-exercise-search-form" role="search">
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <div class="col-12 col-md-10">
          <label for="exercise-search" class="form-label">Search exercises</label>
          <input
            type="search"
            class="form-control"
            id="exercise-search"
            name="search"
            placeholder="Search by exercise name"
          >
        </div>
        <div class="col-12 col-md-2">
          <button type="submit" class="btn btn-primary w-100">Search</button>
        </div>
      </div>
    </div>
  </form>

  <section aria-labelledby="exercise-results-title">
    <div class="fitpulse-dashboard-panel-heading">
      <span class="fitpulse-dashboard-eyebrow">BROWSE THE LIBRARY</span>
      <h2 class="h4 mb-0" id="exercise-results-title">Exercise library</h2>
    </div>
    <div class="row g-3" id="external-exercise-results" aria-live="polite" aria-busy="false">
      <p class="col-12 mb-0 text-body-secondary">Search above to browse exercises.</p>
    </div>
  </section>
</section>
