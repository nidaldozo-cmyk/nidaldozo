<div class="fitpulse-auth-shell">
  <section class="card fitpulse-auth-card" aria-labelledby="login-title">
    <h1 class="fitpulse-auth-title" id="login-title">Log in</h1>
    <form>
      <div class="fitpulse-auth-field">
        <label for="login-email">Email:</label>
        <input
          type="email"
          class="form-control"
          id="login-email"
          name="email"
          autocomplete="email"
          required
        >
      </div>
      <div class="fitpulse-auth-field">
        <label for="login-password">Enter Password:</label>
        <input
          type="password"
          class="form-control"
          id="login-password"
          name="password"
          autocomplete="current-password"
          required
        >
      </div>
      <div class="form-check fitpulse-remember">
        <input class="form-check-input" type="checkbox" id="remember-password" name="remember">
        <label class="form-check-label" for="remember-password">Remember password</label>
      </div>
      <button type="submit" class="fitpulse-auth-submit">Log in</button>
    </form>
  </section>
</div>
