<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FitPulse</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="css/style.css?v=49">
  </head>
  <body>
    <img
      class="fitpulse-image-preload"
      src="assets/auth-background.avif"
      alt=""
      aria-hidden="true"
      fetchpriority="high"
    >
    <div class="fitpulse-image-preload" aria-hidden="true">
      <img src="assets/workout-log-icon.svg" alt="" fetchpriority="high">
      <img src="assets/exercise-search-icon.svg" alt="" fetchpriority="high">
      <img src="assets/goal-flag-icon.svg" alt="" fetchpriority="high">
    </div>
    <nav class="navbar navbar-expand-lg navbar-light fitpulse-navbar">
      <div class="container-fluid fitpulse-navbar-shell">
        <a class="navbar-brand fitpulse-logo-link" href="#home">
          <img src="assets/fitpulse-logo.png" alt="FitPulse">
          <img
            class="fitpulse-logo-auth"
            src="assets/fitpulse-logo-auth.png"
            alt=""
            aria-hidden="true"
          >
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#main-navigation"
          aria-controls="main-navigation"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-navigation">
          <ul class="navbar-nav fitpulse-primary-nav mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="#dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="#workouts">Workouts</a></li>
            <li class="nav-item"><a class="nav-link" href="#exercises">Exercises</a></li>
            <li class="nav-item"><a class="nav-link" href="#goals">Goals</a></li>
            <li class="nav-item"><a class="nav-link" href="#profile">Profile</a></li>
          </ul>
          <ul class="navbar-nav ms-lg-auto mb-2 mb-lg-0 gap-lg-4">
            <li class="nav-item"><a class="nav-link fitpulse-login-link" href="#login">Log in</a></li>
            <li class="nav-item"><a class="nav-link fitpulse-register-link" href="#register">Register</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main id="app-content"></main>

    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="js/app.js?v=16"></script>
  </body>
</html>
