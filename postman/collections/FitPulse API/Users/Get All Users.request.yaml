$kind: http-request
name: Get All Users
order: 1000
method: GET
url: '{{base_url}}/users'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response is a JSON array", function () {
          const data = pm.response.json();
          pm.expect(data).to.be.an('array');
      });
